<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API</title>
</head>
<body>
<script>
(async()=>{
const u=new URLSearchParams(location.search);
const q={};
for(const[k,v]of u.entries())q[k]=v;
if(!Object.keys(q).length){console.log("No query parameters");return;}

const m=`You are a WebSim API processor. Process the query parameters and execute required actions using available WebSim functions.

Available WebSim Functions:
- websim.chat.completions.create({messages:[{role:"user",content:"text"}],json:true}) - AI chat with JSON response
- websim.imageGen({prompt:"text",aspect_ratio:"1:1"}) - Generate images
- websim.textToSpeech({text:"text",voice:"en-male"}) - Text to speech
- websim.getUser() - Get current logged in user data
- websim.getCreator() - Get creator data
- websim.getCurrentProject() - Get current project data
- fetch("/api/v1/feed/trending") - Get trending content
- fetch("/api/v1/users/{username}") - Get user data
- fetch("/api/v1/projects/{id}") - Get project data
- fetch("/api/v1/users/{username}/projects") - Get user projects

Query Parameters: ${JSON.stringify(q,null,2)}

Instructions:
1. Extract callback URL from query parameters (callbackurl, callback, cb, return_url, redirect)
2. Analyze expected_response or other parameters to understand what data is needed
3. Execute required WebSim functions to get the requested data
4. For "current_logged_in_user": use websim.getUser()
5. Return JSON with callback URL and response data: {action:"navigate",url:"callback_url",response:data}

Process now:`;

try{
const r=await websim.chat.completions.create({
messages:[{role:"system",content:m}],
json:true
});
const d=JSON.parse(r.content);
console.log("Processing:",d);

// Execute any WebSim functions if needed
if(q.expected_response==="current_logged_in_user"){
const user=await websim.getUser();
d.response=user;
}

const cb=q.callbackurl||q.callback||q.cb||q.return_url||q.redirect||d.url;
if(cb){
const responseData=d.response||d.data||d;
const p=new URLSearchParams({response:JSON.stringify(responseData)});
const url=cb+(cb.includes('?')?'&':'?')+p.toString();
console.log("Navigating to:",url);
location.href=url;
}else{
console.log("No callback URL found");
}
}catch(e){
console.error("Error:",e);
const cb=q.callbackurl||q.callback||q.cb||q.return_url||q.redirect;
if(cb){
const err={error:e.message,query:q};
const p=new URLSearchParams({response:JSON.stringify(err)});
location.href=cb+(cb.includes('?')?'&':'?')+p.toString();
}
}
})();
</script>
